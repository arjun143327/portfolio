<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cinematic Portrait Scroll Sequence</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      min-height: 100%;
      background-color: #000000;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow-x: hidden;
      overscroll-behavior: none;
    }

    /* Minimalist Loading Screen */
    .preloader {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background-color: #000000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      transition: opacity 0.4s ease, visibility 0.4s ease;
    }

    .preloader.fade-out {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .loader-bar-bg {
      width: 140px;
      height: 2px;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 2px;
      overflow: hidden;
    }

    .loader-bar-fill {
      width: 0%;
      height: 100%;
      background: #ffffff;
      transition: width 0.1s ease-out;
    }

    .loader-text {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 12px;
      letter-spacing: 0.18em;
      color: rgba(255, 255, 255, 0.6);
    }

    /* Pinned Hero Section (Full-bleed) */
    .hero-sequence {
      position: relative;
      width: 100vw;
      height: 100vh;
      height: 100svh;
      background-color: #000000;
      overflow: hidden;
    }

    #sequence-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      height: 100svh;
      display: block;
    }
  </style>
</head>
<body>

  <!-- Preloader -->
  <div class="preloader" id="preloader">
    <div class="loader-bar-bg">
      <div class="loader-bar-fill" id="loaderFill"></div>
    </div>
    <div class="loader-text" id="loaderText">0%</div>
  </div>

  <!-- Pinned Sequence Container -->
  <div class="hero-sequence" id="heroSequence">
    <canvas id="sequence-canvas"></canvas>
  </div>

  <!-- GSAP & ScrollTrigger -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>

  <script>
    const TOTAL_FRAMES = 120;
    const canvas = document.getElementById('sequence-canvas');
    const ctx = canvas.getContext('2d', { alpha: false });
    const preloader = document.getElementById('preloader');
    const loaderFill = document.getElementById('loaderFill');
    const loaderText = document.getElementById('loaderText');
    const heroSequence = document.getElementById('heroSequence');

    const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    const images = new Array(TOTAL_FRAMES);
    let loadedCount = 0;
    let currentRenderedIndex = -1;

    function getFrameUrl(index) {
      const padded = String(index + 1).padStart(3, '0');
      return `photos/ezgif-frame-${padded}.jpg`;
    }

    function resizeCanvas() {
      const dpr = window.devicePixelRatio || 1;
      const vw = window.innerWidth;
      const vh = window.innerHeight;

      canvas.style.width = `${vw}px`;
      canvas.style.height = `${vh}px`;
      canvas.width = Math.round(vw * dpr);
      canvas.height = Math.round(vh * dpr);

      if (currentRenderedIndex >= 0 && images[currentRenderedIndex]) {
        drawFrame(currentRenderedIndex, true);
      }
    }

    function drawFrame(frameIndex, force = false) {
      if (frameIndex < 0 || frameIndex >= TOTAL_FRAMES) return;
      if (!force && frameIndex === currentRenderedIndex) return;

      const img = images[frameIndex];
      if (!img || !img.complete) return;

      const cW = canvas.width;
      const cH = canvas.height;
      const iW = img.naturalWidth || img.width;
      const iH = img.naturalHeight || img.height;

      // Full-bleed Cover Fitting algorithm (fills edge-to-edge seamlessly)
      const cRatio = cW / cH;
      const iRatio = iW / iH;

      let dW, dH, oX, oY;

      if (iRatio > cRatio) {
        // Image is wider than canvas -> match height, crop sides
        dH = cH;
        dW = cH * iRatio;
        oX = (cW - dW) / 2;
        oY = 0;
      } else {
        // Image is taller than canvas -> match width, crop top/bottom
        dW = cW;
        dH = cW / iRatio;
        oX = 0;
        oY = (cH - dH) / 2;
      }

      // Fill the canvas with the photo's background color for a seamless blend
      if (!window.extractedBgColor && frameIndex === 0) {
        const tempC = document.createElement('canvas');
        tempC.width = 1; tempC.height = 1;
        const tCtx = tempC.getContext('2d');
        // Sample a 1x1 pixel near the top-left (10, 10) to avoid any edge artifacts
        tCtx.drawImage(img, 10, 10, 1, 1, 0, 0, 1, 1);
        const p = tCtx.getImageData(0,0,1,1).data;
        window.extractedBgColor = `rgb(${p[0]}, ${p[1]}, ${p[2]})`;
        
        // Update document background to match the photo
        document.body.style.backgroundColor = window.extractedBgColor;
        document.getElementById('heroSequence').style.backgroundColor = window.extractedBgColor;
      }

      const bgColor = window.extractedBgColor || '#000000';
      ctx.fillStyle = bgColor;
      ctx.fillRect(0, 0, cW, cH);
      
      ctx.drawImage(img, oX, oY, dW, dH);
      currentRenderedIndex = frameIndex;
    }

    function initAnimation() {
      gsap.registerPlugin(ScrollTrigger);

      if (prefersReducedMotion) {
        drawFrame(TOTAL_FRAMES - 1, true);
        return;
      }

      drawFrame(0, true);

      // Direct ScrollTrigger pinning & frame scrubbing
      ScrollTrigger.create({
        trigger: heroSequence,
        start: "top top",
        end: "+=3000", // 3000px pinned scroll distance for smooth scrubbing
        pin: true,
        scrub: 0.1, // smooth 0.1s catch-up for 60fps responsiveness
        onUpdate: (self) => {
          const targetIndex = Math.min(
            TOTAL_FRAMES - 1,
            Math.max(0, Math.floor(self.progress * TOTAL_FRAMES))
          );
          drawFrame(targetIndex);
        }
      });

      ScrollTrigger.refresh();
    }

    function preload() {
      for (let i = 0; i < TOTAL_FRAMES; i++) {
        const img = new Image();
        img.onload = () => {
          images[i] = img;
          loadedCount++;
          const pct = Math.floor((loadedCount / TOTAL_FRAMES) * 100);
          loaderFill.style.width = `${pct}%`;
          loaderText.textContent = `${pct}%`;

          if (loadedCount === TOTAL_FRAMES) {
            resizeCanvas();
            setTimeout(() => {
              preloader.classList.add('fade-out');
              initAnimation();
            }, 200);
          }
        };
        img.onerror = () => {
          const fallback = new Image();
          fallback.onload = () => {
            images[i] = fallback;
            loadedCount++;
            const pct = Math.floor((loadedCount / TOTAL_FRAMES) * 100);
            loaderFill.style.width = `${pct}%`;
            loaderText.textContent = `${pct}%`;
            if (loadedCount === TOTAL_FRAMES) {
              resizeCanvas();
              setTimeout(() => {
                preloader.classList.add('fade-out');
                initAnimation();
              }, 200);
            }
          };
          fallback.src = `assets/frame-${String(i + 1).padStart(3, '0')}.jpg`;
        };
        img.src = getFrameUrl(i);
      }
    }

    window.addEventListener('resize', () => {
      resizeCanvas();
      ScrollTrigger.refresh();
    });

    preload();
  </script>
</body>
</html>
